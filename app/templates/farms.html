{% extends 'base.html' %}
{% block title %}Tenyészetek szótár - OptiBreed{% endblock %}

{% block content %}
<style>
    .back-btn {
        text-decoration: none;
        color: #333;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 10px 15px;
        background-color: #eee;
        border-radius: var(--border-radius);
        margin-bottom: 2rem;
    }

    .back-btn:hover {
        background-color: #ddd;
    }

    .pagination-controls {
        padding: 10px 0;
        text-align: center;
        margin-bottom: 1rem;
    }

    .pagination-controls select,
    .pagination-controls button {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: var(--border-radius);
        margin: 0 5px;
        cursor: pointer;
    }

    #grid-header {
        padding: 10px;
        background-color: #f2f2f2;
        font-weight: bold;
        border-radius: var(--border-radius) var(--border-radius) 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .search-controls {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    .search-controls input {
        padding: 6px 10px;
        border: 1px solid #ddd;
        border-radius: var(--border-radius);
    }
</style>

<a href="{{ url_for('main.index') }}" class="back-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5" />
        <polyline points="12 19 5 12 12 5" />
    </svg>
    Vissza a főoldalra
</a>

<h1>Tenyészetek szótár</h1>

<div class="grid-container" style="display: none;">
    <div id="grid-header">
        <div style="display: flex; gap: 1rem; align-items: center;">
            <span id="load-info"></span>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap">
            <div class="search-controls">
                <label for="search-query" style="font-weight: normal; font-size: 0.95rem;">Keresés:</label>
                <input type="text" id="search-query" placeholder="Keresés tenyészet név vagy kód alapján...">
                <span id="search-status"></span>
            </div>
            <label style="font-weight: normal; font-size: 0.95rem"><input type="checkbox" id="filter-torzs" /> Csak
                Törzstenyészet</label>
        </div>
    </div>

    <div class="pagination-controls">
        <span>Oldalankénti sorok: </span>
        <select id="rows-per-page">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
        </select>
        <button id="prev-page">Előző</button>
        <span id="page-info"></span>
        <button id="next-page">Következő</button>
    </div>

    <table class="pedigree-table">
        <thead>
            <tr>
                <th>Tenyészet Kód (TENYKOD)</th>
                <th>Tenyészet Név (TENYNEV)</th>
                <th>Helység (HELYSEG)</th>
                <th>Törzstenyészet-e</th>
            </tr>
        </thead>
        <tbody id="grid-body"></tbody>
    </table>
</div>

<script>
    let data = [];
    let currentPage = 1;
    const rowsPerPage = document.getElementById("rows-per-page");

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function getCurrentSourceData() {
        const filterTorz = document.getElementById("filter-torzs");
        const searchQuery = document.getElementById("search-query");

        let baseData = data;
        if (filterTorz && filterTorz.checked) {
            baseData = data.filter((row) => {
                const torzsteny = String(row['TORZSTENYESZET'] || row['torzstenyeszet'] || '').toLowerCase();
                return torzsteny === 'igen' || torzsteny === 'ïgen' || torzsteny === '1' || torzsteny === 'true';
            });
        }

        const query = searchQuery ? searchQuery.value.trim().toLowerCase() : "";
        if (!query) {
            return baseData;
        }
        return baseData.filter((row) => {
            const tenyNev = row['TENYNEV'] ? String(row['TENYNEV']).toLowerCase() : '';
            const tenyKod = row['TENYKOD'] ? String(row['TENYKOD']).toLowerCase() : '';
            const helyseg = row['HELYSEG'] ? String(row['HELYSEG']).toLowerCase() : '';
            return tenyNev.includes(query) || tenyKod.includes(query) || helyseg.includes(query);
        });
    }

    function updateSearchStatus() {
        const statusEl = document.getElementById("search-status");
        const searchQuery = document.getElementById("search-query");
        if (!statusEl) return;
        const query = searchQuery ? searchQuery.value.trim() : "";
        const total = getCurrentSourceData().length;
        statusEl.textContent = query ? `Találat: ${total}` : `Összes: ${total}`;
    }

    function renderGrid() {
        const gridContainer = document.querySelector(".grid-container");
        if (!Array.isArray(data) || data.length === 0) {
            gridContainer.style.display = "none";
            return;
        }
        gridContainer.style.display = "block";
        const tableBody = document.getElementById("grid-body");
        const pageInfo = document.getElementById("page-info");
        tableBody.innerHTML = "";

        const rows = parseInt(rowsPerPage.value, 10);
        const sourceData = getCurrentSourceData();
        const totalPages = Math.max(1, Math.ceil(sourceData.length / rows));

        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const start = (currentPage - 1) * rows;
        const end = start + rows;
        const paginatedData = sourceData.slice(start, end);

        paginatedData.forEach((row) => {
            const tenykod = escapeHtml(row['TENYKOD']);
            const tenynev = escapeHtml(row['TENYNEV']);
            const helyseg = escapeHtml(row['HELYSEG']);

            let torzsteny = escapeHtml(row['TORZSTENYESZET'] || row['torzstenyeszet'] || '');
            const checked = (torzsteny.toLowerCase() === 'igen' || torzsteny.toLowerCase() === 'ïgen' || torzsteny === '1' || torzsteny === 'true');
            const torzstenyHtml = `<input type="checkbox" disabled ${checked ? "checked" : ""}>`;

            const rowHtml = `
        <tr>
          <td>${tenykod}</td>
          <td>${tenynev}</td>
          <td>${helyseg}</td>
          <td style="text-align:center;">${torzstenyHtml}</td>
        </tr>`;
            tableBody.innerHTML += rowHtml;
        });

        pageInfo.textContent = `Oldal ${currentPage} / ${totalPages}`;
        updateSearchStatus();
    }

    document.addEventListener("DOMContentLoaded", () => {
        fetch('/api/farms')
            .then(response => response.json())
            .then(result => {
                data = result.records || [];
                document.getElementById('load-info').textContent = `Betöltve: ${data.length} sor`;
                renderGrid();
            })
            .catch(error => console.error("Error loading farm data:", error));

        rowsPerPage.addEventListener("change", () => {
            currentPage = 1;
            renderGrid();
        });

        const searchQuery = document.getElementById("search-query");
        if (searchQuery) {
            searchQuery.addEventListener("input", () => {
                currentPage = 1;
                renderGrid();
            });
        }

        const filterTorz = document.getElementById("filter-torzs");
        if (filterTorz) {
            filterTorz.addEventListener("change", () => {
                currentPage = 1;
                renderGrid();
            });
        }

        document.getElementById("prev-page").addEventListener("click", () => {
            if (currentPage > 1) {
                currentPage--;
                renderGrid();
            }
        });

        document.getElementById("next-page").addEventListener("click", () => {
            const rows = parseInt(rowsPerPage.value, 10);
            const totalPages = Math.max(1, Math.ceil(getCurrentSourceData().length / rows));
            if (currentPage < totalPages) {
                currentPage++;
                renderGrid();
            }
        });
    });
</script>
{% endblock %}

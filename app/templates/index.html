{% extends 'base.html' %} {% block title %}Fájl feltöltés - OptiBreed{% endblock
%} {% block content %}
<style>
  .upload-box {
    text-align: center;
    padding: 2rem;
    border: 2px dashed #ccc;
    border-radius: var(--border-radius);
    background-color: #fafafa;
    margin-bottom: 2rem;
  }
  .upload-box h1 {
    margin-top: 0;
  }
  .upload-box p {
    margin-bottom: 1.5rem;
    color: #666;
  }
  .upload-box input[type=\"file\"] {
    display: none;
  }
  .file-label {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 12px 20px;
    background-color: var(--secondary-color);
    color: white;
    border-radius: var(--border-radius);
    cursor: pointer;
    font-weight: bold;
  }
  .file-label:hover {
    background-color: var(--primary-color);
  }
  #file-name {
    margin-top: 1rem;
    font-style: italic;
    color: #555;
  }
  .pagination-controls {
    padding: 10px 0;
    text-align: center;
    margin-bottom: 1rem;
  }
  .pagination-controls select,
  .pagination-controls button {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: var(--border-radius);
    margin: 0 5px;
    cursor: pointer;
  }
  #progress-bar-container {
    width: 100%;
    background-color: #ddd;
    border-radius: var(--border-radius);
    overflow: hidden;
  }
  #progress-bar {
    width: 0%;
    height: 30px;
    background-color: var(--primary-color);
    text-align: center;
    line-height: 30px;
    color: white;
    transition: width 0.5s ease;
  }
  #progress-container {
    margin: 2rem 0;
  }
  #progress-status {
    text-align: center;
    margin-top: 0.5rem;
    color: #333;
  }
  .error-container {
    color: #d8000c;
    background-color: #ffd2d2;
    border: 1px solid #d8000c;
    border-radius: var(--border-radius);
    padding: 1rem;
    margin-bottom: 1rem;
    display: none;
  }
  #grid-header {
    padding: 10px;
    background-color: #f2f2f2;
    font-weight: bold;
    border-radius: var(--border-radius) var(--border-radius) 0 0;
    display: flex;
    justify-content: space-between;
  }
  #algorithm-select {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: var(--border-radius);
    background-color: white;
    cursor: pointer;
  }
  .button {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }
  .missing-parent {
    color: #e74c3c;
    font-style: italic;
    font-weight: bold;
  }
  .parent-link {
    color: inherit;
    text-decoration: underline;
    cursor: pointer;
  }
  .search-controls {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .search-controls select,
  .search-controls input {
    padding: 6px 10px;
    border: 1px solid #ddd;
    border-radius: var(--border-radius);
  }
  #search-status {
    font-size: 0.9rem;
    color: #555;
    min-width: 120px;
    text-align: right;
  }
  .row-highlight {
    background-color: rgba(0, 90, 156, 0.12) !important;
    outline: 2px solid var(--primary-color);
    transition:
      background-color 0.8s ease,
      outline-color 0.8s ease;
  }
  .row-highlight td {
    background-color: rgba(0, 90, 156, 0.12) !important;
  }
</style>

<div class="upload-box">
  <h1>Pedigré fájl feltöltése</h1>
  <p>Kérjük, válasszon ki egy CSV formátumú pedigré fájlt a feltöltéshez.</p>

  <div class="error-container" id="error-container"></div>

  <form
    id="upload-form"
    method="post"
    enctype="multipart/form-data"
    action="{{ url_for('main.upload_and_process_stream') }}"
  >
    <label for="pedigree_file" class="file-label">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" />
        <line x1="16" y1="13" x2="8" y2="13" />
        <line x1="16" y1="17" x2="8" y2="17" />
        <polyline points="10 9 9 9 8 9" />
      </svg>
      Fájl kiválasztása
    </label>
    <input
      type="file"
      id="pedigree_file"
      name="pedigree_file"
      onchange="updateFileName()"
      required
      style="display: none"
    />
    <p id="file-name">Nincs fájl kiválasztva.</p>
    <button type="submit" class="button">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      Adatok feltöltése
    </button>
  </form>
</div>

<div
  id="ibc-controls"
  style="margin-bottom: 2rem; display: none; align-items: center; gap: 1rem"
>
  <label for="algorithm-select" style="font-weight: bold"
    >Válasszon algoritmust:</label
  >
  <select id="algorithm-select">
    <option value="both">Hagyományos és Meuwissen-Luo</option>
    <option value="traditional">Hagyományos</option>
    <option value="meuwissen">Meuwissen-Luo</option>
  </select>
  <button id="calculate-ibc" class="button">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="2" y="2" width="20" height="20" rx="2" ry="2" />
      <path
        d="M9 7H7v2h2V7zm4 0h-2v2h2V7zm4 0h-2v2h2V7zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm-8 4H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"
      />
    </svg>
    Beltenyésztettség számítása
  </button>
  <button id="go-to-mating" class="button" style="display: none">
    Tovább a párosításhoz
  </button>
</div>

<div id="progress-container" style="display: none">
  <div id="progress-bar-container">
    <div id="progress-bar">0%</div>
  </div>
  <div id="progress-status">Számítás indul...</div>
</div>

<div class="grid-container" style="display: none">
  <div id="grid-header">
    <div style="display: flex; gap: 1rem; align-items: center">
      <span id="load-info"></span>
      <span id="calc-info"></span>
    </div>
    <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap">
      <div class="search-controls">
        <label
          for="search-field"
          style="font-weight: normal; font-size: 0.95rem"
          >Keresés:</label
        >
        <select id="search-field">
          <option value="animal_id">Egyed azonosító</option>
          <option value="dam_id">Anya azonosító</option>
          <option value="sire_id">Apa azonosító</option>
          <option value="farm">Tenyészet</option>
        </select>
        <input
          type="text"
          id="search-query"
          placeholder="Részszöveg keresése"
        />
        <span id="search-status"></span>
      </div>
      <label style="font-weight: normal; font-size: 0.95rem"
        ><input type="checkbox" id="filter-torzs" /> Csak Törzs</label
      >
    </div>
  </div>
  <div class="pagination-controls">
    <span>Oldalankénti sorok: </span>
    <select id="rows-per-page">
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <button id="prev-page">Előző</button>
    <span id="page-info"></span>
    <button id="next-page">Következő</button>
  </div>
  <table class="pedigree-table">
    <thead id="grid-head"></thead>
    <tbody id="grid-body"></tbody>
  </table>
</div>

<script>
  let data = [];
  let currentSessionId = null;
  let missingParents = new Set();

  function updateFileName() {
    const input = document.getElementById("pedigree_file");
    const fileNameDisplay = document.getElementById("file-name");
    fileNameDisplay.textContent =
      input.files.length > 0
        ? `Kiválasztott fájl: ${input.files[0].name}`
        : "Nincs fájl kiválasztva.";
  }

  document
    .getElementById("go-to-mating")
    .addEventListener("click", async () => {
      if (currentSessionId) {
        window.location.href = `/pedigree/mating_selection?session_id=${currentSessionId}`;
      }
    });

  document
    .getElementById("upload-form")
    .addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const errorContainer = document.getElementById("error-container");
      const ibcControls = document.getElementById("ibc-controls");
      const matingButton = document.getElementById("go-to-mating");
      const loadInfo = document.getElementById("load-info");
      const calcInfo = document.getElementById("calc-info");
      const progressContainer = document.getElementById("progress-container");
      const progressBar = document.getElementById("progress-bar");
      const progressStatus = document.getElementById("progress-status");

      errorContainer.style.display = "none";
      errorContainer.textContent = "";
      ibcControls.style.display = "none";
      progressContainer.style.display = "block";
      progressBar.style.width = "0%";
      progressBar.textContent = "0%";
      progressStatus.textContent = "Fájl feltöltése...";

      // Hide grid immediately when upload starts
      const gridContainer = document.querySelector(".grid-container");
      gridContainer.style.display = "none";

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: formData,
        });
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.trim()) continue;
            const parts = line.split("\n");
            let eventType = "message";
            let eventData = null;

            for (const part of parts) {
              if (part.startsWith("event: ")) {
                eventType = part.substring(7);
              } else if (part.startsWith("data: ")) {
                try {
                  eventData = JSON.parse(part.substring(6));
                } catch (e) {
                  console.error("Failed to parse event data:", part, e);
                }
              }
            }

            if (eventData) {
              if (eventType === "progress") {
                const percent = eventData.progress || 0;
                progressBar.style.width = percent + "%";
                progressBar.textContent = percent + "%";
                const stage = eventData.stage || "Feldolgozás";
                const detail = eventData.total_animals
                  ? ` (${eventData.total_animals} egyед)`
                  : "";
                progressStatus.textContent = `${stage}${detail}`;
              } else if (eventType === "complete") {
                currentSessionId = eventData.session_id;
                missingParents = new Set(
                  (eventData.missing_parents || []).map((id) =>
                    normalizeAnimalId(id),
                  ),
                );
                headers = [
                  "animal_id",
                  "dam_id",
                  "sire_id",
                  "farm",
                  "birth_year",
                  "gender",
                  "torzs_e",
                  "torzshim",
                ];
                currentPage = 1;
                loadInfo.textContent = `Betöltött egyedek: ${eventData.animal_count} (Betöltési idő: ${eventData.load_time.toFixed(2)}s)`;
                calcInfo.textContent = "";
                ibcControls.style.display = "flex";
                matingButton.style.display = "none";
                matingButton.disabled = true;
                progressBar.style.width = "100%";
                progressBar.textContent = "100%";
                progressStatus.textContent = "Kész";
                progressContainer.style.display = "none";
                // Fetch data separately
                fetch(`/get_data?session_id=${currentSessionId}`)
                  .then((response) => {
                    if (!response.ok) {
                      throw new Error(
                        `HTTP ${response.status}: ${response.statusText}`,
                      );
                    }
                    return response.json();
                  })
                  .then((dataResponse) => {
                    console.log(
                      "Data loaded after CSV upload:",
                      dataResponse.records?.length,
                      "records",
                    );
                    data = dataResponse.records;

                    // Restore missing parents
                    missingParents = new Set(
                      (dataResponse.missing_parents || []).map((id) =>
                        normalizeAnimalId(id),
                      ),
                    );
                    console.log(
                      "Missing parents restored:",
                      missingParents.size,
                    );

                    renderGrid();
                    gridContainer.style.display = "block";
                    matingButton.style.display = "inline-block";
                    matingButton.disabled = false;
                  })
                  .catch((error) => {
                    console.error("Error fetching data after upload:", error);
                    console.error("Session ID was:", currentSessionId);
                    // Show error
                    const errorContainer =
                      document.getElementById("error-container");
                    errorContainer.textContent =
                      "Hiba az adatok betöltése során: " + error.message;
                    errorContainer.style.display = "block";
                  });
              } else if (eventType === "error") {
                throw new Error(
                  eventData.error || "Ismeretlen hiba a feltöltés során",
                );
              }
            }
          }
        }
      } catch (error) {
        errorContainer.textContent = error.message;
        errorContainer.style.display = "block";
        progressContainer.style.display = "none";
        data = [];
        renderGrid();
        matingButton.style.display = "none";
        matingButton.disabled = true;
      }
    });

  const rowsPerPage = document.getElementById("rows-per-page");
  let currentPage = 1;

  const headerMappings = {
    animal_id: "Egyed azonosító",
    dam_id: "Anya",
    sire_id: "Apa",
    farm: "Tenyészet",
    birth_year: "Szül. Év",
    gender: "Ivar",
    torzs_e: "Törzs-e",
    torzshim: "Törzshím",
    ibc_default: "BTE (Alapértelmezett)",
    ibc_traditional: "BTE (Hagyományos)",
    ibc_meuwissen: "BTE (Meuwissen-Luo)",
  };
  let headers = [
    "animal_id",
    "dam_id",
    "sire_id",
    "farm",
    "birth_year",
    "gender",
    "torzshim",
  ];

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normalizeAnimalId(value) {
    return String(value === null || value === undefined ? "" : value).trim();
  }

  function getCurrentSourceData() {
    const filterTorz = document.getElementById("filter-torzs");
    const searchField = document.getElementById("search-field");
    const searchQuery = document.getElementById("search-query");

    const baseData =
      filterTorz && filterTorz.checked
        ? data.filter(
            (r) =>
              r &&
              (r.torzs_e === "ïgen" ||
                r.torzs_e === "igen" ||
                r.torzs_e === "true" ||
                r.torzs_e === "1"),
          )
        : data;

    const field = searchField ? searchField.value : "animal_id";
    const query = searchQuery
      ? normalizeAnimalId(searchQuery.value).toLowerCase()
      : "";

    if (!query) {
      return baseData;
    }

    return baseData.filter((row) =>
      normalizeAnimalId(row[field]).toLowerCase().includes(query),
    );
  }

  function highlightAnimalRow(animalId) {
    const normalizedTargetId = normalizeAnimalId(animalId);
    const targetRow = Array.from(
      document.querySelectorAll("#grid-body tr[data-animal-id]"),
    ).find(
      (row) =>
        normalizeAnimalId(row.getAttribute("data-animal-id")) ===
        normalizedTargetId,
    );
    if (targetRow) {
      targetRow.scrollIntoView({ behavior: "smooth", block: "center" });
      targetRow.classList.add("row-highlight");
      setTimeout(() => targetRow.classList.remove("row-highlight"), 4000);
    }
  }

  function updateSearchStatus() {
    const statusEl = document.getElementById("search-status");
    const searchQuery = document.getElementById("search-query");

    if (!statusEl) return;

    const query = searchQuery ? normalizeAnimalId(searchQuery.value) : "";
    const total = getCurrentSourceData().length;
    statusEl.textContent = query ? `Találat: ${total}` : `Összes: ${total}`;
  }

  function navigateToAnimal(animalId) {
    const rows = parseInt(rowsPerPage.value, 10);
    const filterTorz = document.getElementById("filter-torzs");
    const normalizedTargetId = normalizeAnimalId(animalId);
    let sourceData = getCurrentSourceData();
    let targetIndex = sourceData.findIndex(
      (row) => normalizeAnimalId(row.animal_id) === normalizedTargetId,
    );

    if (targetIndex === -1 && filterTorz && filterTorz.checked) {
      filterTorz.checked = false;
      sourceData = getCurrentSourceData();
      targetIndex = sourceData.findIndex(
        (row) => normalizeAnimalId(row.animal_id) === normalizedTargetId,
      );
    }

    if (targetIndex === -1) {
      const searchQuery = document.getElementById("search-query");
      if (searchQuery && normalizeAnimalId(searchQuery.value) !== "") {
        searchQuery.value = "";
        sourceData = getCurrentSourceData();
        targetIndex = sourceData.findIndex(
          (row) => normalizeAnimalId(row.animal_id) === normalizedTargetId,
        );
      }
    }

    if (targetIndex === -1) {
      alert(`A szülő egyed nem található: ${animalId}`);
      return;
    }

    currentPage = Math.floor(targetIndex / rows) + 1;
    renderGrid();
    highlightAnimalRow(animalId);
  }

  function renderGrid() {
    const gridContainer = document.querySelector(".grid-container");
    if (!Array.isArray(data) || data.length === 0) {
      gridContainer.style.display = "none";
      return;
    }
    const tableHead = document.getElementById("grid-head");
    const tableBody = document.getElementById("grid-body");
    const pageInfo = document.getElementById("page-info");
    tableHead.innerHTML = "";
    tableBody.innerHTML = "";
    gridContainer.style.display = "block";

    const rows = parseInt(rowsPerPage.value, 10);
    let headerHtml = "<tr>";
    headers.forEach((header) => {
      headerHtml += `<th>${headerMappings[header] || header}</th>`;
    });
    headerHtml += "</tr>";
    tableHead.innerHTML = headerHtml;

    const sourceData = getCurrentSourceData();
    const totalPages = Math.max(1, Math.ceil(sourceData.length / rows));
    if (currentPage > totalPages) currentPage = totalPages;
    if (currentPage < 1) currentPage = 1;

    const start = (currentPage - 1) * rows;
    const end = start + rows;
    const paginatedData = sourceData.slice(start, end);

    paginatedData.forEach((row) => {
      let rowHtml = `<tr data-animal-id="${row.animal_id}">`;
      headers.forEach((header) => {
        let cellValue = row[header];
        if (
          header === "farm" &&
          (cellValue === undefined || cellValue === null)
        ) {
          cellValue = row["farm_id"];
        }
        cellValue =
          cellValue === null || cellValue === undefined ? "" : cellValue;

        const isParentCell = header === "sire_id" || header === "dam_id";
        const isMissingParent =
          isParentCell && missingParents.has(normalizeAnimalId(cellValue));

        let classList = `cell-${header}`;
        // Apply missing-parent class for missing parent IDs
        if (isMissingParent) {
          classList += " missing-parent";
        }

        if (header === "gender") {
          cellValue =
            cellValue === "F"
              ? "Nőstény"
              : cellValue === "M"
                ? "Hím"
                : cellValue;
        } else if (header === "torzs_e") {
          const checked =
            cellValue === "ïgen" ||
            cellValue === "igen" ||
            cellValue === "true" ||
            cellValue === "1";
          cellValue = `<input type="checkbox" disabled ${checked ? "checked" : ""}>`;
        } else if (header === "torzshim") {
          const checked =
            cellValue === true ||
            cellValue === "True" ||
            cellValue === "true" ||
            cellValue === "1";
          cellValue = `<input type="checkbox" disabled ${checked ? "checked" : ""}>`;
        } else if (
          isParentCell &&
          !isMissingParent &&
          String(cellValue).trim() !== ""
        ) {
          const safeValue = escapeHtml(cellValue);
          const encodedParentId = encodeURIComponent(String(cellValue));
          cellValue = `<a href="#" class="parent-link" data-parent-id="${encodedParentId}">${safeValue}</a>`;
        } else if (
          header === "ibc_traditional" ||
          header === "ibc_meuwissen" ||
          header === "ibc_default"
        ) {
          if (typeof cellValue === "number") {
            cellValue = cellValue.toFixed(4);
          }
        }
        rowHtml += `<td class="${classList}">${cellValue}</td>`;
      });
      rowHtml += "</tr>";
      tableBody.innerHTML += rowHtml;
    });

    pageInfo.textContent = `Oldal ${currentPage} / ${totalPages}`;
    updateSearchStatus();
  }

  document.addEventListener("DOMContentLoaded", () => {
    // Check if returning from mating selection with an existing session
    const urlParams = new URLSearchParams(window.location.search);
    const sessionIdFromUrl = urlParams.get("session_id");

    if (sessionIdFromUrl) {
      // Restore the session
      currentSessionId = sessionIdFromUrl;
      console.log("Restoring session:", currentSessionId);

      // Fetch and display the data
      fetch(`/get_data?session_id=${currentSessionId}`)
        .then(async (response) => {
          console.log("Response status:", response.status);
          console.log("Response ok:", response.ok);
          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            console.error("Error response:", errorData);
            throw new Error(errorData.error || "Session expired or invalid");
          }
          return response.json();
        })
        .then((dataResponse) => {
          console.log(
            "Data loaded successfully, records:",
            dataResponse.records?.length,
          );
          console.log(
            "Missing parents count:",
            dataResponse.missing_parents?.length,
          );
          data = dataResponse.records;

          // Restore missing parents information
          missingParents = new Set(
            (dataResponse.missing_parents || []).map((id) =>
              normalizeAnimalId(id),
            ),
          );

          console.log("About to show grid controls...");
          // Show the grid and controls
          const gridContainer = document.querySelector(".grid-container");
          if (gridContainer) gridContainer.style.display = "block";

          const ibcControls = document.getElementById("ibc-controls");
          if (ibcControls) ibcControls.style.display = "block";

          const matingButton = document.getElementById("go-to-mating");
          if (matingButton) matingButton.style.display = "inline-block";

          console.log("About to render grid...");
          // Render the grid
          renderGrid();
          console.log("Grid rendered successfully!");

          // Clean URL (remove session_id parameter) without page reload
          window.history.replaceState(
            {},
            document.title,
            window.location.pathname,
          );
        })
        .catch((error) => {
          console.error("Error restoring session:", error);
          console.error("Error stack:", error.stack);
          alert(
            "A munkamenet lejárt vagy érvénytelen. Kérjük, töltsön fel újra egy fájlt.",
          );
        });
    }

    rowsPerPage.addEventListener("change", () => {
      currentPage = 1;
      renderGrid();
    });

    const searchField = document.getElementById("search-field");
    const searchQuery = document.getElementById("search-query");

    if (searchField && searchQuery) {
      searchField.addEventListener("change", () => {
        currentPage = 1;
        renderGrid();
      });
      searchQuery.addEventListener("input", () => {
        currentPage = 1;
        renderGrid();
      });
      searchQuery.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          currentPage = 1;
          renderGrid();
        }
      });
    }

    const filterTorz = document.getElementById("filter-torzs");
    if (filterTorz) {
      filterTorz.addEventListener("change", () => {
        currentPage = 1;
        renderGrid();
      });
    }
    document.getElementById("prev-page").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderGrid();
      }
    });
    document.getElementById("next-page").addEventListener("click", () => {
      const rows = parseInt(rowsPerPage.value, 10);
      const totalPages = Math.max(
        1,
        Math.ceil(getCurrentSourceData().length / rows),
      );
      if (currentPage < totalPages) {
        currentPage++;
        renderGrid();
      }
    });

    updateSearchStatus();

    document.getElementById("grid-body").addEventListener("click", (event) => {
      const link = event.target.closest(".parent-link");
      if (!link) return;
      event.preventDefault();
      const parentId = decodeURIComponent(
        link.getAttribute("data-parent-id") || "",
      );
      if (parentId) {
        navigateToAnimal(parentId);
      }
    });

    document
      .getElementById("calculate-ibc")
      .addEventListener("click", async () => {
        if (!currentSessionId) {
          alert(
            "Hiba: Nincs érvényes munkamenet. Kérjük, töltsön fel egy fájlt.",
          );
          return;
        }

        const calcButton = document.getElementById("calculate-ibc");
        const calcButtonContent = calcButton.innerHTML;
        calcButton.disabled = true;

        const progressContainer = document.getElementById("progress-container");
        const progressBar = document.getElementById("progress-bar");
        const progressStatus = document.getElementById("progress-status");
        progressContainer.style.display = "block";
        progressBar.style.width = "0%";
        progressBar.textContent = "0%";
        progressStatus.textContent = "Kapcsolódás a számítási folyamhoz...";

        const algorithm = document.getElementById("algorithm-select").value;

        if (
          (algorithm === "both" || algorithm === "traditional") &&
          !headers.includes("ibc_traditional")
        ) {
          headers.push("ibc_traditional");
          data.forEach((d) => (d.ibc_traditional = "..."));
        }
        if (
          (algorithm === "both" || algorithm === "meuwissen") &&
          !headers.includes("ibc_meuwissen")
        ) {
          headers.push("ibc_meuwissen");
          data.forEach((d) => (d.ibc_meuwissen = "..."));
        }
        data.forEach((d) => {
          if (algorithm === "both") {
            d.ibc_default =
              d.ibc_meuwissen !== undefined ? d.ibc_meuwissen : "...";
          } else if (algorithm === "meuwissen") {
            d.ibc_default =
              d.ibc_meuwissen !== undefined ? d.ibc_meuwissen : "...";
          } else {
            d.ibc_default =
              d.ibc_traditional !== undefined ? d.ibc_traditional : "...";
          }
        });
        renderGrid();

        const evtSource = new EventSource(
          `/calculate_ibcs?session_id=${currentSessionId}&algorithm=${algorithm}`,
        );

        evtSource.onmessage = function (event) {
          const eventData = JSON.parse(event.data);

          const animalIndex = data.findIndex(
            (animal) => animal.animal_id == eventData.animal_id,
          );
          if (animalIndex !== -1) {
            if (eventData.hasOwnProperty("ibc_meuwissen")) {
              data[animalIndex].ibc_meuwissen = eventData.ibc_meuwissen;
            }
            if (eventData.hasOwnProperty("ibc_traditional")) {
              data[animalIndex].ibc_traditional = eventData.ibc_traditional;
            }
            if (eventData.hasOwnProperty("ibc_default")) {
              data[animalIndex].ibc_default = eventData.ibc_default;
            }
          }

          progressBar.style.width = eventData.progress + "%";
          progressBar.textContent = eventData.progress + "%";
          progressStatus.textContent = `Feldolgozva: ${eventData.animal_id}, Folyamat: ${eventData.progress} %`;

          const row = document.querySelector(
            `tr[data-animal-id="${eventData.animal_id}"]`,
          );
          if (row) {
            if (eventData.hasOwnProperty("ibc_meuwissen")) {
              const cell = row.querySelector(".cell-ibc_meuwissen");
              if (cell) cell.textContent = eventData.ibc_meuwissen.toFixed(4);
            }
            if (eventData.hasOwnProperty("ibc_traditional")) {
              const cell = row.querySelector(".cell-ibc_traditional");
              if (cell) cell.textContent = eventData.ibc_traditional.toFixed(4);
            }
            if (eventData.hasOwnProperty("ibc_default")) {
              const cell = row.querySelector(".cell-ibc_default");
              if (cell) cell.textContent = eventData.ibc_default.toFixed(4);
            }
          }
        };

        evtSource.addEventListener("complete", function (event) {
          const eventData = JSON.parse(event.data);
          document.getElementById("calc-info").textContent =
            `Számítási idő: ${eventData.calculation_time.toFixed(2)}s`;
          progressStatus.textContent = `Számítás befejezve!`;
          progressBar.style.width = "100%";
          progressBar.textContent = "100%";
          setTimeout(() => {
            progressContainer.style.display = "none";
          }, 5000);
          evtSource.close();
          finalizeButton(calcButtonContent);
          const matingButton = document.getElementById("go-to-mating");
          matingButton.style.display = "inline-block";
          matingButton.disabled = false;
        });

        evtSource.addEventListener("error", function (event) {
          let errorMsg = "Hiba történt a szerverrel való kommunikáció során.";
          if (event.data) {
            try {
              errorMsg = JSON.parse(event.data).error || errorMsg;
            } catch (e) {}
          }
          alert(errorMsg);
          progressContainer.style.display = "none";
          evtSource.close();
          finalizeButton(calcButtonContent);
        });

        function finalizeButton(content) {
          calcButton.disabled = false;
          calcButton.innerHTML = content;
        }
      });
  });
</script>
{% endblock %}

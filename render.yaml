services:
  - type: web
    name: optibreed
    env: docker
    plan: free # Change to 'starter' or higher for production
    healthCheckPath: /health
    preDeployCommand: "echo 'Deployment starting...'"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12
      - key: FLASK_ENV
        value: production
